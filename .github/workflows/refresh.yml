name: Hourly odds refresh
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour: GitHub often delays or drops scheduled runs
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish          # full runs, hourly refreshes and the daily learning take turns, so none overwrites another
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy: ${{ steps.go.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install numpy requests pillow
      - id: go
        env:
          GH_TOKEN: ${{ github.token }}
          DATAGOVSG_API_KEY: ${{ secrets.DATAGOVSG_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          echo "deploy=false" >> $GITHUB_OUTPUT
          mkdir -p site/data
          REL=$(gh release list --limit 4 --json tagName,createdAt -q '[.[] | select(.tagName|startswith("archive-"))] | sort_by(.createdAt) | last | .tagName')
          ASSET=$(gh release view "$REL" --json assets -q '[.assets[].name | select(startswith("inputs-"))] | sort | last')
          [ -z "$ASSET" ] && { echo "no archived inputs"; exit 0; }
          STAMP=${ASSET#inputs-}; STAMP=${STAMP%.json.gz}
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$(echo $STAMP | sed -E 's/(....)(..)(..)T(..)(..)Z/\1-\2-\3 \4:\5/')" +%s) ) / 60 ))
          echo "latest full run $STAMP, $AGE minutes ago"
          if [ "$AGE" -lt 40 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "full run is fresh; skipping"; exit 0; fi
          gh release download "$REL" -p "$ASSET" -D .work --clobber
          gunzip -c ".work/$ASSET" > site/data/inputs.json
          python tools/refresh_obs.py site/data/inputs.json || { rc=$?; if [ $rc -eq 3 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi; [ $rc -eq 3 ] || exit 1; }
          cp engine/engine.js site/engine.js
          node engine/run.js --n 100000 2>&1 | tee .work/run.log
          cp .work/run.log site/data/run-log.txt
          cp history/replay/summary.json site/data/replay.json 2>/dev/null || true
          cp history/learn/log.json site/data/learn.json 2>/dev/null || true
          SITE_URL="${{ vars.SITE_URL }}" python tools/build_static.py || echo "static copies failed"
          python tools/scorecard.py || echo "scorecard failed"
          python tools/market_history.py || echo "market history failed"
          python tools/column.py || echo "column failed"
          # home cities: latest saved run, re-anchored to each city's newest reading
          CREL=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=4" -q '[.[] | select(.tag_name|startswith("archive-"))] | .[].tag_name' | head -2)
          for R in $CREL; do CA=$(gh release view "$R" --json assets -q '[.assets[].name | select(startswith("cities-"))] | sort | last'); if [ -n "$CA" ]; then gh release download "$R" -p "$CA" -D .work --clobber && tar -xzf ".work/$CA" -C site/data && break; fi; done
          python tools/refresh_city_obs.py site/data/cities || true
          node engine/run_city.js --n 60000 || true
          python tools/fetch_aq.py site/data/aq.json || true
          mkdir -p .work/fonts
          for f in barlow/Barlow-Bold barlow/Barlow-Medium barlow/Barlow-SemiBold barlowsemicondensed/BarlowSemiCondensed-Bold; do
            curl -sSfL -o .work/fonts/$(basename $f).ttf "https://github.com/google/fonts/raw/main/ofl/$f.ttf" || true
          done
          python tools/og_image.py site/data/forecast.json site/data/inputs.json site/data/og.png .work/fonts || echo "share image failed"
          git config user.name "haze-twin bot"; git config user.email "haze-twin-bot@users.noreply.github.com"
          git add history/runs.json history/obs.json
          if ! git diff --cached --quiet; then
            git commit -m "Hourly refresh [skip ci]"
            for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null || true; sleep 5; done
          fi
          # keep every hourly issuance as published
          DAY=$(date -u +%Y-%m-%d); STAMP=$(date -u +%Y%m%dT%H%MZ)
          gh release view "archive-${DAY}" >/dev/null 2>&1 || gh release create "archive-${DAY}" --title "Archive ${DAY}" --notes "Inputs and forecasts issued on ${DAY} (UTC). Every forecast is kept as issued." --latest=false || true
          cp site/data/forecast.json ".work/forecast-${STAMP}-hourly.json" && gh release upload "archive-${DAY}" ".work/forecast-${STAMP}-hourly.json" --clobber || echo "archive upload failed"
          echo "deploy=true" >> $GITHUB_OUTPUT
      - if: steps.go.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.go.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
