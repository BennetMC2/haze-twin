name: Probe ECMWF
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt}
      - run: pip install -r pipeline/requirements.txt
      - run: python tools/probe_ecmwf.py aifs-ens ifs
      - name: Save
        if: ${{ !cancelled() }}
        run: |
          git config user.name "haze-twin bot"; git config user.email "haze-twin-bot@users.noreply.github.com"
          git add history/probe_ecmwf.txt; git commit -m "ECMWF probe [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
