name: Probe archives
on:
  push:
    branches: [main]
    paths: ["tools/probe.sh", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          DATAGOVSG_API_KEY: ${{ secrets.DATAGOVSG_API_KEY }}
        run: bash tools/probe.sh
      - name: Save
        run: |
          git config user.name "haze-twin bot"; git config user.email "haze-twin-bot@users.noreply.github.com"
          sed -i "s/${{ secrets.FIRMS_MAP_KEY }}/KEY/g" history/probe.txt || true
          git add history/probe.txt; git commit -m "Probe results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
