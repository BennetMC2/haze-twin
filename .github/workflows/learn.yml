name: Daily learning
on:
  schedule:
    - cron: "30 5 * * *"   # 1:30 pm Singapore, after NEA's noon reading
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publish          # full runs, hourly refreshes and the daily learning take turns, so none overwrites another
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Score, review and correct
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/learn.py
      - name: Save and refresh the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "haze-twin bot"; git config user.email "haze-twin-bot@users.noreply.github.com"
          git add history/learn
          git commit -m "Daily learning [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null || true; sleep 5; done
          gh workflow run refresh.yml --ref main
